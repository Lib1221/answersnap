<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Crop target</title>
    <style>
      html,
      body {
        margin: 0;
        background: #ffffff;
        font: 14px/1.4 sans-serif;
      }
      #block {
        position: absolute;
        left: 300px;
        top: 200px;
        width: 300px;
        height: 200px;
        background: rgb(220, 30, 30);
        color: #ffffff;
        font-size: 12px;
      }
      #block span {
        position: absolute;
        left: 4px;
        top: 2px;
      }
    </style>
  </head>
  <body>
    <div id="block"><span>Red block</span></div>
  </body>
</html>
